<!DOCTYPE html>
<html lang="zh-CN" data-v-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 辅助原型 · 活动全流程 · Vibers</title>
<link rel="icon" type="image/svg+xml" href="../assets/brand/icon/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/base.css">
<script src="../assets/brand/vibers-marks.js"></script>
<script src="../assets/js/theme.js"></script>
<style>
  /* ============ 查看器外壳：左目录 · 中样机 · 右说明 ============ */
  html,body{height:100%}
  body{overflow:hidden}
  .al-app{display:grid;grid-template-columns:252px 200px minmax(0,1fr) 336px;height:100vh}
  .al-rail{display:flex;flex-direction:column;border-right:1px solid var(--v-border-subtle);min-height:0}
  .al-rail-head{flex:none;padding:22px 20px 16px;border-bottom:1px solid var(--v-border-subtle)}
  .al-brand{display:flex;align-items:center;gap:10px}
  .al-brand-label{font:500 11px/16px Sora,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--v-text-tertiary)}
  .al-rail-title{margin-top:14px;font:500 17px/24px Sora,'Noto Sans SC',sans-serif;letter-spacing:-.01em;color:var(--v-text-primary)}
  .al-rail-sub{margin-top:4px;font-size:12px;line-height:18px;color:var(--v-text-tertiary)}
  .al-dir{flex:1;min-height:0;overflow-y:auto;padding:10px 12px 28px}
  .al-dir-stage{margin-top:16px;padding:0 8px;display:flex;align-items:center;gap:8px;font:500 12px/16px Sora,'Noto Sans SC',sans-serif;color:var(--v-signal-text)}
  .al-dir-stage:first-child{margin-top:6px}
  .al-dir-stage-n{font:500 10px/1 Sora,sans-serif;letter-spacing:.12em;color:var(--v-text-tertiary)}
  .al-dir-item{display:flex;align-items:center;gap:9px;width:100%;box-sizing:border-box;margin-top:2px;padding:8px 8px;border:0;border-radius:10px;background:none;text-align:left;cursor:pointer;color:var(--v-text-secondary);font:400 13px/18px Sora,'Noto Sans SC',sans-serif}
  .al-dir-item:hover{background:color-mix(in srgb, var(--v-text-primary) 4%, transparent);color:var(--v-text-primary)}
  .al-dir-item--active{background:color-mix(in srgb, var(--v-brand-signal) 10%, transparent);color:var(--v-text-primary)}
  .al-dir-id{flex:none;font:500 10.5px/1 Sora,sans-serif;letter-spacing:.06em;color:var(--v-text-tertiary);width:30px}
  .al-dir-item--active .al-dir-id{color:var(--v-signal-text)}
  .al-dir-t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .al-dir-flag{flex:none;font:500 10px/1 Sora,sans-serif;padding:3px 5px;border-radius:5px;color:var(--v-text-tertiary);border:1px solid var(--v-border-subtle)}
  .al-dir-flag--p0{color:var(--v-signal-text);border-color:color-mix(in srgb, var(--v-brand-signal) 40%, transparent)}
  .al-rail-foot{flex:none;padding:12px 20px 16px;border-top:1px solid var(--v-border-subtle);font-size:11.5px;line-height:17px;color:var(--v-text-tertiary)}
  .al-rail-foot a{color:var(--v-text-secondary)}

  .al-stage{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0}
  .al-stage-head{flex:none;display:flex;align-items:center;gap:14px;padding:16px 28px;border-bottom:1px solid var(--v-border-subtle);flex-wrap:wrap}
  .al-stage-title{font:500 16px/22px Sora,'Noto Sans SC',sans-serif;letter-spacing:-.01em;color:var(--v-text-primary)}
  .al-stage-where{font-size:12px;color:var(--v-text-tertiary)}
  .al-surface{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:7px;border:1px solid var(--v-border-default);font:500 11px/1 Sora,'Noto Sans SC',sans-serif;color:var(--v-text-secondary)}
  .al-states{margin-left:auto;display:inline-flex;align-items:center;gap:4px;padding:4px;border-radius:12px;background:color-mix(in srgb, var(--v-text-primary) 5%, transparent)}
  .al-state{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:9px;border:0;background:none;font:500 12.5px/1 Sora,'Noto Sans SC',sans-serif;color:var(--v-text-secondary);cursor:pointer}
  .al-state:hover{color:var(--v-text-primary)}
  .al-state--active{background:var(--v-bg-primary);color:var(--v-text-primary);box-shadow:0 1px 3px rgba(0,0,0,.15)}
  .al-state-n{font:500 10px/1 Sora,sans-serif;color:var(--v-text-tertiary)}
  .al-state--active .al-state-n{color:var(--v-signal-text)}
  .al-stage-body{flex:1;min-height:0;overflow:auto;padding:36px 28px 60px}
  .al-frame{position:relative;margin:0 auto}
  .al-frame--web{width:760px}
  .al-frame--wide{width:900px}
  .al-kbd-hint{position:absolute;right:28px;bottom:14px;font:400 11px/16px Sora,'Noto Sans SC',sans-serif;color:var(--v-text-tertiary);pointer-events:none}
  .al-kbd{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:5px;border:1px solid var(--v-border-subtle);font:500 10px/1 Sora,sans-serif;margin:0 2px}

  /* 左右两栏可折叠：样机贴在中间看正式页面效果。把手贴在样机区左右边缘，收起后还留着，点了再展开；[ ] 两个键也能切 */
  .al-app--rail-off{grid-template-columns:0 0 minmax(0,1fr) 336px}
  .al-app--notes-off{grid-template-columns:252px 200px minmax(0,1fr) 0}
  .al-app--rail-off.al-app--notes-off{grid-template-columns:0 0 minmax(0,1fr) 0}
  .al-rail{grid-column:1}.al-subrail{grid-column:2}.al-stage{grid-column:3}.al-notes{grid-column:4}
  .al-subrail{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--v-border-subtle)}
  .al-subrail .al-dir-t{white-space:normal}
  .al-subrail .al-dir-item{align-items:flex-start}
  .al-subrail .al-dir-id{line-height:18px}
  .al-fold{flex:none;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:999px;border:1px solid var(--v-border-default);background:transparent;color:var(--v-text-tertiary);cursor:pointer}
  .al-fold:hover{color:var(--v-text-primary);border-color:var(--v-border-strong)}
  .al-brand .al-fold{margin-left:auto}
  .al-app--rail-off .al-rail,.al-app--rail-off .al-subrail,.al-app--notes-off .al-notes{display:none}
  .al-edge{position:absolute;top:50%;transform:translateY(-50%);z-index:6;width:18px;height:56px;border-radius:9px;border:1px solid var(--v-border-default);background:var(--v-bg-primary);color:var(--v-text-tertiary);display:grid;place-items:center;cursor:pointer;opacity:.75;transition:opacity .2s,color .2s}
  .al-expand-directory{display:none;flex:none}
  .al-app--rail-off .al-expand-directory{display:inline-flex}
  .al-edge:hover{opacity:1;color:var(--v-text-primary)}
  .al-edge--l{left:8px}.al-edge--r{right:8px}
  .al-edge svg{transition:transform .2s}
  .al-app--rail-off .al-edge--l svg,.al-app--notes-off .al-edge--r svg{transform:rotate(180deg)}

  .al-notes{display:flex;flex-direction:column;border-left:1px solid var(--v-border-subtle);min-height:0}
  .al-notes-head{flex:none;display:flex;align-items:center;gap:10px;padding:18px 22px 14px;border-bottom:1px solid var(--v-border-subtle)}
  .al-notes-title{font:500 13px/18px Sora,'Noto Sans SC',sans-serif;color:var(--v-text-primary)}
  .al-notes-body{flex:1;min-height:0;overflow-y:auto;padding:18px 22px 40px}
  .al-note{margin-top:18px}
  .al-note:first-child{margin-top:0}
  .al-note-k{font:500 10.5px/14px Sora,'Noto Sans SC',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--v-text-tertiary)}
  .al-note-v{margin-top:6px;font-size:13px;line-height:21px;color:var(--v-text-secondary)}
  .al-note-v b{font-weight:500;color:var(--v-text-primary)}
  .al-note-v code{font:500 12px/1 Sora,sans-serif;padding:2px 6px;border-radius:5px;background:color-mix(in srgb, var(--v-text-primary) 6%, transparent);color:var(--v-text-primary)}
  .al-notes-state{margin-top:2px;padding:12px 14px;border-radius:12px;border:1px solid color-mix(in srgb, var(--v-brand-signal) 30%, transparent);background:color-mix(in srgb, var(--v-brand-signal) 5%, transparent);font-size:12.5px;line-height:19px;color:var(--v-text-primary)}
  .al-notes-state b{font-weight:500;color:var(--v-signal-text)}
  .al-theme{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--v-border-default);background:transparent;font:500 12px/1 Sora,sans-serif;color:var(--v-text-secondary);cursor:pointer;margin-left:auto}

  /* ============ AI 动作的统一控件 ============ */
  .al-aibtn{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:8px;border:1px dashed color-mix(in srgb, var(--v-brand-signal) 55%, transparent);background:none;font:500 12px/1 Sora,'Noto Sans SC',sans-serif;color:var(--v-signal-text);cursor:pointer;margin-left:auto}
  .al-aibtn:hover{background:color-mix(in srgb, var(--v-brand-signal) 8%, transparent)}
  .al-aibtn svg{flex:none}
  .al-aibtn--busy{border-style:solid;border-color:color-mix(in srgb, var(--v-brand-signal) 35%, transparent);cursor:default}
  .al-aibtn--busy .al-dot{width:6px;height:6px;border-radius:50%;background:var(--v-brand-signal);animation:vBreathe 1s ease-in-out infinite}
  .al-aibtn--inline{margin-left:0}
  .al-skel{min-height:82px;border-radius:14px;border:1px solid var(--v-border-default);padding:15px 16px;display:flex;flex-direction:column;gap:10px}
  .al-skel span{display:block;height:11px;border-radius:6px;background:linear-gradient(90deg, var(--v-border-subtle), var(--v-border-default), var(--v-border-subtle));background-size:200% 100%;animation:vTrack 1.6s linear infinite}
  .al-skel span:nth-child(2){width:78%}
  .al-skel span:nth-child(3){width:52%}
  .al-skel-note{margin-top:8px;font-size:12px;color:var(--v-text-tertiary)}
  .al-preview{margin-top:10px;border-radius:14px;border:1px solid color-mix(in srgb, var(--v-brand-signal) 32%, transparent);background:color-mix(in srgb, var(--v-brand-signal) 4%, transparent);padding:14px 16px}
  .al-preview-head{display:flex;align-items:center;gap:8px;font:500 11px/16px Sora,'Noto Sans SC',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--v-text-tertiary)}
  .al-preview-body{margin-top:8px;font-size:14px;line-height:23px;color:var(--v-text-primary);white-space:pre-wrap}
  .al-preview-body ins{text-decoration:none;background:color-mix(in srgb, var(--v-brand-signal) 14%, transparent);border-radius:3px;padding:0 2px}
  .al-preview-actions{margin-top:12px;display:flex;gap:8px}
  .al-btn{display:inline-flex;align-items:center;height:32px;padding:0 13px;border-radius:10px;border:1px solid var(--v-border-strong);background:none;color:var(--v-text-primary);font:500 12.5px/1 Sora,'Noto Sans SC',sans-serif;cursor:pointer}
  .al-btn--primary{border:0;background:var(--v-brand-signal);color:var(--v-color-on-signal)}
  .al-btn--ghost{border-color:transparent;color:var(--v-text-tertiary)}
  .al-btn--sm{height:28px;padding:0 10px;font-size:12px;border-radius:8px}
  .al-btn:disabled{opacity:.45;cursor:default}
  .al-line{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:12.5px;line-height:18px;color:var(--v-text-tertiary)}
  .al-line--note{color:var(--v-text-tertiary)}
  .al-line-link{border:0;background:none;padding:0;font:500 12.5px/18px Sora,'Noto Sans SC',sans-serif;color:var(--v-signal-text);cursor:pointer}
  .al-conflicts{margin-top:12px;display:flex;flex-direction:column;gap:7px}
  .al-conflict{display:flex;align-items:flex-start;gap:9px;font-size:12.5px;line-height:19px;color:var(--v-text-secondary)}
  .al-conflict::before{content:'';flex:none;margin-top:7px;width:5px;height:5px;border-radius:50%;background:var(--v-brand-signal)}
  .al-conflict--fixed{color:var(--v-text-tertiary);text-decoration:line-through}
  .al-conflict--fixed::before{background:var(--v-status-approved-dot,#6B9D7A)}
  .al-toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:12px 15px;border-radius:14px;background:var(--v-neutral-action-bg);color:var(--v-neutral-action-fg);font:500 13px/1 Sora,'Noto Sans SC',sans-serif;white-space:nowrap;box-shadow:0 18px 40px -18px rgba(0,0,0,.5)}
  .al-toast-undo{opacity:.62;font-weight:400;cursor:pointer}
  .al-intake-mic--on{box-shadow:0 0 0 6px color-mix(in srgb, var(--v-brand-signal) 22%, transparent);animation:vBreathe 1.6s ease-in-out infinite}
  .al-suggest{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 13px;border-radius:999px;border:1px dashed color-mix(in srgb, var(--v-brand-signal) 60%, transparent);background:color-mix(in srgb, var(--v-brand-signal) 5%, transparent);font:500 13px/1 Sora,'Noto Sans SC',sans-serif;color:var(--v-text-primary);cursor:pointer}
  .al-suggest small{font-weight:400;color:var(--v-text-tertiary);font-size:11px}
  .al-fchips{display:flex;flex-wrap:wrap;gap:7px}
  .al-fchip{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 12px;border-radius:9px;border:1px solid var(--v-border-default);background:none;font:400 12.5px/1 Sora,'Noto Sans SC',sans-serif;color:var(--v-text-secondary);cursor:pointer}
  .al-fchip b{font-weight:500;color:var(--v-text-tertiary)}
  .al-fchip--on{border-color:var(--v-brand-signal);background:color-mix(in srgb, var(--v-brand-signal) 10%, transparent);color:var(--v-signal-text)}
  .al-fchip--on b{color:var(--v-signal-text)}
  .al-intake{border-radius:16px;border:1px solid var(--v-border-default);background:var(--v-bg-surface);padding:14px 16px 12px}
  .al-intake-row{display:flex;align-items:flex-start;gap:12px}
  .al-intake-input{flex:1;min-height:52px;font-size:14px;line-height:22px;color:var(--v-text-tertiary)}
  .al-intake-input--filled{color:var(--v-text-primary);white-space:pre-wrap}
  .al-intake-mic{flex:none;width:40px;height:40px;border-radius:12px;border:0;background:var(--v-brand-signal);color:var(--v-color-on-signal);display:grid;place-items:center;cursor:pointer}
  .al-intake-foot{margin-top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .al-intake-chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:9px;border:1px solid var(--v-border-default);background:none;font:400 12px/1 Sora,'Noto Sans SC',sans-serif;color:var(--v-text-secondary);cursor:pointer}
  .al-intake-hint{margin-left:auto;font-size:11.5px;color:var(--v-text-tertiary)}
  .al-intake--done{padding:12px 16px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--v-text-secondary)}
  .al-intake--done b{font-weight:500;color:var(--v-text-primary)}
  .al-poster{flex:none;width:64px;height:88px;border-radius:9px;border:1px solid var(--v-border-default);background:linear-gradient(160deg, color-mix(in srgb, var(--v-brand-signal) 40%, var(--v-bg-elevated)), var(--v-bg-elevated));display:flex;flex-direction:column;justify-content:flex-end;padding:6px;gap:3px}
  .al-poster i{display:block;height:4px;border-radius:2px;background:rgba(245,243,239,.6)}
  .al-poster i:nth-child(2){width:70%;opacity:.6}
  .al-poster i:nth-child(3){width:45%;opacity:.4}
  .al-orbline{display:flex;align-items:center;gap:11px;font-size:13px;color:var(--v-text-primary)}
  .al-orbline .dw{position:relative;display:grid;place-items:center;width:22px;height:22px;flex:none}
  .al-orbline .dw::before{content:"";position:absolute;width:20px;height:20px;border-radius:50%;filter:blur(6px);background:radial-gradient(circle, rgba(237,106,44,.7) 0%, transparent 72%);animation:vDriftA 5s ease-in-out infinite}
  .al-orbline .dw::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--v-text-primary);animation:vBreathe 2.6s ease-in-out infinite}
  .al-ask{display:flex;gap:12px;margin-top:14px}
  .al-ask-icon{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:10px;background:color-mix(in srgb, var(--v-brand-signal) 10%, transparent);border:1px solid color-mix(in srgb, var(--v-brand-signal) 35%, transparent);color:var(--v-signal-text)}
  .al-ask-bubble{flex:1;padding:12px 14px;border-radius:6px 16px 16px 16px;border:1px solid var(--v-border-subtle);background:var(--v-bg-surface);font-size:14px;line-height:22px;color:var(--v-text-primary)}
  .al-ask-sub{margin-top:4px;font-size:12px;color:var(--v-text-tertiary)}
  .al-user-bubble{align-self:flex-end;max-width:76%;margin-top:12px;padding:11px 14px;border-radius:16px 16px 6px 16px;background:color-mix(in srgb, var(--v-text-primary) 6%, transparent);border:1px solid var(--v-border-subtle);font-size:14px;line-height:22px;color:var(--v-text-primary)}
  .al-summary{margin-top:8px;padding:12px 14px;border-radius:12px;border:1px solid var(--v-border-subtle);background:var(--v-bg-surface)}
  .al-summary-head{display:flex;align-items:center;gap:8px;font:500 11px/16px Sora,'Noto Sans SC',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--v-text-tertiary)}
  .al-summary-item{display:flex;align-items:flex-start;gap:9px;margin-top:9px;font-size:13px;line-height:20px;color:var(--v-text-primary)}
  .al-summary-item b{flex:none;font-weight:500;color:var(--v-signal-text);font-variant-numeric:tabular-nums}
  .al-summary-item q{color:var(--v-text-secondary);quotes:'「' '」'}
  .al-summary-item .al-line-link{margin-left:auto;flex:none}
  .al-cover-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
  .al-cover-opt{position:relative;aspect-ratio:4/3;border-radius:14px;border:1px solid var(--v-border-default);overflow:hidden;background:var(--v-bg-elevated);cursor:pointer;padding:14px;display:flex;flex-direction:column;justify-content:flex-end;gap:5px}
  .al-cover-opt--on{border-color:var(--v-brand-signal);box-shadow:0 0 0 1px var(--v-brand-signal)}
  .al-cover-opt .t{font:500 15px/19px Sora,'Noto Sans SC',sans-serif;letter-spacing:-.01em;color:var(--v-text-primary)}
  .al-cover-opt .d{font:400 10.5px/14px Sora,sans-serif;color:var(--v-text-secondary)}
  .al-cover-opt .m{position:absolute;top:12px;left:12px;color:var(--v-brand-signal)}
  .al-cover-opt--a{background:linear-gradient(160deg, color-mix(in srgb, var(--v-brand-signal) 55%, #141414), #141414)}
  .al-cover-opt--b{background:#141414}
  .al-cover-opt--b .t{color:var(--v-brand-signal)}
  .al-cover-opt--c{background:var(--v-brand-paper)}
  .al-cover-opt--c .t{color:#141414}
  .al-cover-opt--c .d{color:rgba(20,20,20,.6)}
  .al-cover-opt--c .m{color:#141414}
  .al-diff{margin-top:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--v-border-subtle);background:var(--v-bg-surface);font-size:13px;line-height:20px;color:var(--v-text-secondary)}
  .al-diff-row{display:flex;align-items:center;gap:10px;padding:5px 0}
  .al-diff-row b{font-weight:500;color:var(--v-text-primary)}
  .al-diff-row .old{text-decoration:line-through;color:var(--v-text-tertiary)}
  .al-diff-row .al-line-link{margin-left:auto}
  .al-timeline{margin-top:10px;border-radius:14px;border:1px solid var(--v-border-default);overflow:hidden}
  .al-tl-row{display:flex;align-items:center;gap:14px;padding:11px 15px;border-top:1px solid var(--v-border-subtle);font-size:13.5px;color:var(--v-text-primary)}
  .al-tl-row:first-child{border-top:0}
  .al-tl-row .t{flex:none;width:52px;font:500 13px/1 Sora,sans-serif;font-variant-numeric:tabular-nums;color:var(--v-text-secondary)}
  .al-tl-row .x{margin-left:auto;color:var(--v-text-tertiary);font-size:12px}
  .al-script{margin-top:12px;border-radius:14px;border:1px solid var(--v-border-subtle);padding:16px 18px}
  .al-script-h{font:500 11px/16px Sora,'Noto Sans SC',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--v-text-tertiary)}
  .al-script-p{margin-top:8px;font-size:14px;line-height:24px;color:var(--v-text-primary)}

  .al-star{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;border:0;background:none;color:var(--v-text-tertiary);cursor:pointer}

  .al-rule-tag{display:inline-flex;align-items:center;height:18px;padding:0 7px;border-radius:5px;background:color-mix(in srgb, var(--v-text-primary) 6%, transparent);font:500 10.5px/1 Sora,'Noto Sans SC',sans-serif;color:var(--v-text-tertiary)}

  /* ============ 网页端工作台（借用 pub-c-editor 的骨架，无外框） ============ */
  .ce2-head{min-height:60px;display:flex;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid var(--v-border-subtle);flex-wrap:wrap}

  .ce2-head-sub{font:400 12px/16px Sora,'Noto Sans SC',sans-serif;color:var(--v-text-tertiary)}
  .ce2-status-chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;background:var(--v-status-approved-bg);color:var(--v-status-approved-text);font:500 11px/1 Sora,'Noto Sans SC',sans-serif}
  .ce2-status-chip--draft{background:color-mix(in srgb, var(--v-text-primary) 6%, transparent);color:var(--v-text-secondary)}

  .ce2-head-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
  .ce2-btn-outline{display:inline-flex;align-items:center;height:36px;padding:0 14px;border-radius:11px;border:1px solid var(--v-border-strong);font:500 13px/1 Sora,'Noto Sans SC',sans-serif;color:var(--v-text-primary);cursor:pointer;background:transparent}
  .ce2-htabs{display:flex;gap:26px;border-bottom:1px solid var(--v-border-subtle)}
  .ce2-htab{position:relative;display:inline-flex;align-items:center;gap:7px;height:46px;padding:0 2px;border:0;background:none;font:500 14px/1 Sora,'Noto Sans SC',sans-serif;color:var(--v-text-tertiary);cursor:pointer}
  .ce2-htab--active{color:var(--v-text-primary)}
  .ce2-htab--active::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--v-brand-signal)}
  .ce2-htab-flag{display:inline-flex;align-items:center;height:17px;padding:0 6px;border-radius:6px;background:color-mix(in srgb, var(--v-brand-signal) 12%, transparent);font:500 11px/1 Sora,sans-serif;color:var(--v-signal-text)}
  .ce2-main{padding:34px 0 48px}
  .ce2-panel-h3{margin:0;font:500 22px/30px Sora,'Noto Sans SC',sans-serif;letter-spacing:-.02em;color:var(--v-text-primary)}
  .ce2-panel-sub{margin:8px 0 0;font-size:14px;line-height:22px;color:var(--v-text-secondary)}
  .ce2-field{margin-top:22px}
  .ce2-field-label-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .ce2-field-label{font:500 13px/18px Sora,'Noto Sans SC',sans-serif;color:var(--v-text-secondary)}
  .ce2-src-chip{display:inline-flex;align-items:center;gap:5px;height:19px;padding:0 8px;border-radius:6px;background:color-mix(in srgb, var(--v-brand-signal) 10%, transparent);font:500 11px/1 Sora,'Noto Sans SC',sans-serif;color:var(--v-signal-text)}
  .ce2-src-chip--infer{background:none;border:1px solid color-mix(in srgb, var(--v-brand-signal) 45%, transparent)}
  .ce2-src-chip--muted{background:color-mix(in srgb, var(--v-text-primary) 6%, transparent);color:var(--v-text-tertiary)}
  .ce2-input{display:flex;align-items:center;width:100%;box-sizing:border-box;min-height:48px;border-radius:14px;border:1px solid var(--v-border-default);background:transparent;padding:0 16px;font:15px/1 'Noto Sans SC',sans-serif;color:var(--v-text-primary)}
  .ce2-input--empty{color:var(--v-text-tertiary)}
  .ce2-input--focus{border-color:var(--v-brand-signal)}
  .ce2-textarea{display:block;width:100%;box-sizing:border-box;min-height:82px;border-radius:14px;border:1px solid var(--v-border-default);background:transparent;padding:13px 16px;font:15px/24px 'Noto Sans SC',sans-serif;color:var(--v-text-primary);white-space:pre-wrap}
  .ce2-textarea--empty{color:var(--v-text-tertiary)}
  .ce2-textarea--tall{min-height:200px}
  .ce2-row-2{display:flex;gap:14px}
  .ce2-row-2 > div{flex:1}
  .ce2-cover{height:210px;border-radius:16px;overflow:hidden;border:1px solid var(--v-border-default);position:relative;cursor:pointer}
  .ce2-cover-fallback{position:absolute;inset:0;overflow:hidden;background:var(--v-bg-elevated)}
  .ce2-cover-fallback-glow{position:absolute;inset:-30%;background:radial-gradient(circle at 30% 30%, var(--v-brand-signal) 0%, transparent 62%),radial-gradient(circle at 75% 70%, var(--v-brand-signal) 0%, transparent 55%);filter:blur(36px);opacity:.4}
  .ce2-cover-fallback-mark{position:absolute;inset:0;display:grid;place-items:center;color:color-mix(in srgb, var(--v-text-primary) 60%, transparent)}
  .ce2-cover-badge{position:absolute;top:10px;left:10px;display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:7px;background:rgba(0,0,0,.55);color:#fff;font:500 11px/1 Sora,'Noto Sans SC',sans-serif;backdrop-filter:blur(6px)}
  .ce2-cover-ai-btn{position:absolute;bottom:10px;right:10px;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:9px;border:1px solid color-mix(in srgb, var(--v-brand-signal) 45%, transparent);background:color-mix(in srgb, var(--v-bg-primary) 75%, transparent);color:var(--v-text-primary);font:500 12px/1 Sora,'Noto Sans SC',sans-serif;cursor:pointer;backdrop-filter:blur(6px)}
  .ce2-cover-ai-btn svg{color:var(--v-signal-text)}
  .ce2-tag-chips{display:flex;flex-wrap:wrap;gap:8px}
  .ce2-tag-chip{display:inline-flex;align-items:center;gap:7px;min-height:32px;padding:0 8px 0 13px;border-radius:999px;border:1px solid var(--v-brand-signal);background:color-mix(in srgb, var(--v-brand-signal) 10%, transparent);font:500 13px/1 Sora,'Noto Sans SC',sans-serif;color:var(--v-signal-text)}
  .ce2-tag-chip-x{display:grid;place-items:center;width:17px;height:17px;border-radius:50%;background:color-mix(in srgb, currentColor 18%, transparent);font-size:11px}
  .ce2-tag-chip-off{display:inline-flex;align-items:center;min-height:32px;padding:0 13px;border-radius:999px;border:1px solid var(--v-border-default);font:400 13px/1 Sora,'Noto Sans SC',sans-serif;color:var(--v-text-secondary);background:none}
  .ce2-details-toggle{margin-top:22px;border-radius:14px;border:1px solid var(--v-border-subtle)}

  .ce2-details-toggle-body{padding:0 16px 16px}
  .ce2-toggle-row{display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-top:1px solid var(--v-border-subtle)}
  .ce2-toggle-row:first-of-type{border-top:0}
  .ce2-create{display:flex;gap:44px;align-items:flex-start}
  .ce2-create-cover-col{width:300px;flex:none}
  .ce2-cover-hint{margin-top:11px;font:400 12px/18px Sora,'Noto Sans SC',sans-serif;color:var(--v-text-tertiary);text-align:center}
  .ce2-create-form-col{flex:1;min-width:0}
  .ce2-create-src-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .ce2-create-title{display:block;width:100%;box-sizing:border-box;border:0;border-bottom:1px solid transparent;padding:0 0 7px;font:500 28px/36px Sora,'Noto Sans SC',sans-serif;letter-spacing:-.02em;color:var(--v-text-primary)}

  .ce2-create-about{display:block;width:100%;box-sizing:border-box;padding:7px 0 0;font:400 15px/23px 'Noto Sans SC',sans-serif;color:var(--v-text-secondary);min-height:30px}

  .ce2-create-block{margin-top:24px;border:1px solid var(--v-border-default);border-radius:16px;overflow:hidden;background:var(--v-bg-surface)}
  .ce2-create-row{display:flex;align-items:center;gap:12px;min-height:54px;padding:8px 16px;border-top:1px solid var(--v-border-subtle);box-sizing:border-box;font:400 14px/20px Sora,'Noto Sans SC',sans-serif;color:var(--v-text-primary)}

  .ce2-create-row-icon{flex:none;display:inline-flex;color:var(--v-text-tertiary)}

  .ce2-create-row .sub{margin-top:2px;font-size:12px;color:var(--v-text-tertiary)}
  .ce2-create-options-label{margin:26px 0 0;font:500 13px/18px Sora,'Noto Sans SC',sans-serif;color:var(--v-text-secondary)}

  .ce2-create-opt-label{font-size:14px;color:var(--v-text-primary)}
  .ce2-create-opt-sub{margin-top:2px;font-size:12px;color:var(--v-text-tertiary)}
  .ce2-create-publish{margin-top:28px;width:100%;min-height:52px;border:0;border-radius:16px;background:var(--v-brand-signal);color:var(--v-color-on-signal);font:500 15px/20px Sora,'Noto Sans SC',sans-serif;cursor:pointer}

  .ce2-create-gate-hint{margin-top:10px;min-height:18px;text-align:center;font:400 12px/18px Sora,'Noto Sans SC',sans-serif;color:var(--v-text-tertiary)}
  .ce2-ov{display:flex;flex-direction:column;gap:14px}

  .ce2-pub-hero-title{font:500 15px/20px Sora,'Noto Sans SC',sans-serif;color:var(--v-text-primary)}
  .ce2-pub-hero-sub{margin-top:2px;font-size:12px;color:var(--v-text-tertiary)}
  .ce2-pub-link{display:flex;align-items:center;gap:9px;margin-left:auto;padding:8px 12px;border-radius:11px;background:color-mix(in srgb, var(--v-text-primary) 4%, transparent);max-width:300px;min-width:0}
  .ce2-pub-link-text{flex:1;min-width:0;font:400 12px/17px Sora,sans-serif;color:var(--v-text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .ce2-btn-share-primary{display:inline-flex;align-items:center;height:36px;padding:0 16px;border-radius:11px;border:0;background:var(--v-brand-signal);color:var(--v-color-on-signal);font:500 13px/1 Sora,'Noto Sans SC',sans-serif;cursor:pointer;flex:none}
  .ce2-hero-actions{width:100%;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--v-border-subtle)}
  .ce2-next{display:flex;flex-direction:column;gap:0;padding:14px 20px;border:1px solid var(--v-border-subtle);border-radius:16px}

  .al-modal-sub{margin-top:6px;font-size:13px;line-height:20px;color:var(--v-text-secondary)}
  .al-modal-actions{display:flex;gap:9px;margin-top:18px;justify-content:flex-end}
  .al-scrim{border-radius:18px;background:color-mix(in srgb, var(--v-bg-primary) 60%, transparent)}

  /* ============ 审核台 ============ */
  .fr-top-title{font:500 20px/28px Sora,'Noto Sans SC',sans-serif;letter-spacing:-.015em;color:var(--v-text-primary)}
  .fr-top-sub{margin-top:3px;font-size:13px;color:var(--v-text-tertiary)}
  .fr-tabs{display:flex;gap:18px;margin-top:16px;border-bottom:1px solid var(--v-border-subtle)}
  .fr-tab{padding:0 0 10px;font:400 14px/19px Sora,'Noto Sans SC',sans-serif;color:var(--v-text-secondary);background:none;border:0}
  .fr-tab[aria-selected="true"]{font-weight:500;color:var(--v-text-primary);box-shadow:inset 0 -2px 0 0 var(--v-brand-signal)}
  .fr-app-row{display:flex;align-items:flex-start;gap:12px;padding:16px 0;border-top:1px solid var(--v-border-subtle)}
  .fr-app-row:first-child{border-top:0}
  .fr-app-row--selected{margin:0 -14px;padding:16px 14px;border-radius:14px;background:color-mix(in srgb, var(--v-brand-signal) 7%, transparent);border-top:1px solid transparent}
  .fr-app-row--dim{opacity:.35}
  .fr-app-check{flex:none;margin-top:12px;width:16px;height:16px;accent-color:var(--v-brand-signal)}
  .fr-app-avatar{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--v-bg-elevated);font:500 14px/1 Sora,sans-serif;color:var(--v-text-secondary)}
  .fr-app-name{font:500 14px/20px Sora,'Noto Sans SC',sans-serif;color:var(--v-text-primary)}
  .fr-app-time{flex:none;font-size:12px;color:var(--v-text-tertiary)}
  .fr-app-preview{margin-top:3px;font-size:12px;line-height:19px;color:var(--v-text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fr-app-tags{margin-top:8px;display:flex;gap:6px}
  .fr-mini-badge{display:inline-flex;align-items:center;height:21px;padding:0 7px;border-radius:6px;background:var(--v-status-neutral-bg);font-size:11px;color:var(--v-status-neutral-text)}
  .fr-batch-bar{margin-top:12px;display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;background:color-mix(in srgb, var(--v-brand-signal) 10%, transparent);border:1px solid color-mix(in srgb, var(--v-brand-signal) 30%, transparent);font-size:13px;color:var(--v-signal-text)}
  .fr-batch-btn{height:32px;padding:0 13px;border-radius:9px;border:0;font:500 13px/1 Sora,'Noto Sans SC',sans-serif;cursor:pointer}
  .fr-batch-btn--primary{background:var(--v-brand-signal);color:var(--v-color-on-signal)}
  .fr-batch-btn--danger{background:color-mix(in srgb, var(--v-status-rejected-text) 12%, transparent);color:var(--v-status-rejected-text)}
  .fr-drawer{width:min(440px,52%);flex:none;border-left:1px solid var(--v-border-default);padding:0 0 0 24px;display:flex;flex-direction:column}
  .fr-detail-avatar{flex:none;display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--v-bg-elevated);border:1px solid var(--v-border-default);font:500 20px/1 Sora,sans-serif;color:var(--v-text-secondary)}
  .fr-detail-name{font:500 22px/30px Sora,'Noto Sans SC',sans-serif;letter-spacing:-.018em;color:var(--v-text-primary)}
  .fr-detail-tag{display:inline-flex;align-items:center;height:26px;padding:0 9px;border-radius:8px;border:1px solid var(--v-border-strong);font-size:12px;color:var(--v-text-secondary)}
  .fr-eyebrow{font:500 11px/16px Sora,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--v-text-tertiary)}
  .fr-answer{margin-top:8px;font:400 15px/25px 'Noto Sans SC',sans-serif;color:var(--v-text-primary)}
  .fr-answer mark{background:color-mix(in srgb, var(--v-brand-signal) 16%, transparent);color:inherit;border-radius:3px;padding:0 2px}
  .fr-meta-row{display:flex;justify-content:space-between;gap:16px;padding:9px 0;font-size:13px;border-top:1px solid var(--v-border-subtle)}
  .fr-meta-row:first-of-type{border-top:0}
  .fr-meta-k{color:var(--v-text-tertiary)}
  .fr-meta-v{color:var(--v-text-primary)}
  .fr-action-btn{height:44px;padding:0 22px;border:0;border-radius:14px;background:var(--v-brand-signal);color:var(--v-color-on-signal);font:500 14px/20px Sora,'Noto Sans SC',sans-serif;cursor:pointer}
  .fr-action-danger{height:44px;padding:0 20px;border:1px solid color-mix(in srgb, var(--v-status-rejected-text) 40%, transparent);border-radius:14px;background:color-mix(in srgb, var(--v-status-rejected-text) 7%, transparent);color:var(--v-status-rejected-text);font:500 14px/20px Sora,'Noto Sans SC',sans-serif;cursor:pointer}
  .fr-kbd{display:grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:6px;border:1px solid var(--v-border-subtle);font:500 11px/1 Sora,sans-serif;color:var(--v-text-tertiary)}

  /* ============ Host 后台 ============ */
  .jd-stats{display:grid;grid-template-columns:1fr 1fr 1fr;border-radius:16px;border:1px solid var(--v-border-subtle);background:var(--v-bg-surface);overflow:hidden}
  .jd-stat{padding:16px 20px;border-right:1px solid var(--v-border-subtle)}
  .jd-stat:last-child{border-right:0}
  .jd-stat-v{font:500 22px/28px Sora,sans-serif;font-variant-numeric:tabular-nums;color:var(--v-text-primary)}
  .jd-stat-v--signal{color:var(--v-signal-text)}
  .jd-stat-l{margin-top:3px;font-size:12px;color:var(--v-text-tertiary)}
  .jd-section-head{display:flex;align-items:baseline;gap:10px;margin-top:26px}
  .jd-section-title{font:500 14px/20px Sora,'Noto Sans SC',sans-serif;color:var(--v-text-primary)}
  .jd-section-meta{font-size:12px;color:var(--v-text-tertiary)}
  .jd-todo-card{margin-top:12px;border-radius:16px;border:1px solid var(--v-border-subtle);overflow:hidden}
  .jd-todo-row{display:flex;align-items:center;gap:13px;padding:13px 16px;border-bottom:1px solid var(--v-border-subtle)}
  .jd-todo-row:last-child{border-bottom:0}
  .jd-todo-title{font-size:14px;color:var(--v-text-primary)}
  .jd-todo-sub{margin-top:2px;font-size:12px;color:var(--v-text-tertiary)}
  .jd-todo-action{margin-left:auto;flex:none;display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:9px;border:1px solid var(--v-border-strong);font:500 13px/1 Sora,'Noto Sans SC',sans-serif;color:var(--v-text-primary);background:none;cursor:pointer}
  .jd-events-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
  .jd-event-card{border-radius:16px;border:1px solid var(--v-border-subtle);overflow:hidden}
  .jd-event-top{display:flex;gap:13px;padding:14px 15px}
  .jd-event-cover{width:60px;height:60px;flex:none;border-radius:11px;background:var(--v-bg-elevated)}
  .jd-event-title{font:500 15px/20px Sora,'Noto Sans SC',sans-serif;color:var(--v-text-primary)}
  .jd-event-meta{margin-top:3px;font-size:12px;color:var(--v-text-secondary)}
  .jd-event-foot{display:flex;align-items:center;gap:10px;padding:11px 15px;border-top:1px solid var(--v-border-subtle)}
  .jd-event-foot-txt{flex:1;font-size:13px;color:var(--v-text-secondary)}
  .jd-event-foot-link{font:500 13px/1 Sora,'Noto Sans SC',sans-serif;color:var(--v-signal-text)}
  .jd-people{margin-top:12px;border-radius:16px;border:1px solid var(--v-border-subtle);overflow:hidden}
  .jd-person{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--v-border-subtle)}
  .jd-person:first-child{border-top:0}
  .jd-person-av{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--v-bg-elevated);font:500 12px/1 Sora,sans-serif;color:var(--v-text-secondary)}
  .jd-person-name{font:500 13.5px/18px Sora,'Noto Sans SC',sans-serif;color:var(--v-text-primary)}
  .jd-person-sub{margin-top:1px;font-size:12px;color:var(--v-text-tertiary)}
  .jd-search{display:flex;align-items:center;gap:10px;margin-top:12px;min-height:44px;padding:0 14px;border-radius:13px;border:1px solid var(--v-border-default);font-size:14px;color:var(--v-text-primary)}
  .jd-search .ph{color:var(--v-text-tertiary)}

  /* ============ 第三轮新增：红字警示 · 海报 · 对话页 · 数据分析 · 现场进度 ============ */
  .al-warn{color:var(--v-status-rejected-text)}
  .al-warn .al-line-link{color:var(--v-status-rejected-text)}
  .al-poster-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
  .al-poster-card{position:relative;aspect-ratio:9/16;border-radius:14px;border:1px solid var(--v-border-default);overflow:hidden;background:#141414;color:#F5F3EF;padding:16px 14px;display:flex;flex-direction:column;cursor:pointer}
  .al-poster-card--on{border-color:var(--v-brand-signal);box-shadow:0 0 0 1px var(--v-brand-signal)}
  .al-poster-card .k{font:500 9px/12px Sora,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:rgba(245,243,239,.5)}
  .al-poster-card .t{margin-top:8px;font:500 15px/19px Sora,'Noto Sans SC',sans-serif;letter-spacing:-.01em}
  .al-poster-card .s{margin-top:6px;font-size:10px;line-height:15px;color:rgba(245,243,239,.66)}
  .al-poster-card .g{margin-top:auto;font-size:10px;line-height:15px}
  .al-poster-card .g b{display:block;font-weight:500;color:#F5F3EF}
  .al-poster-card .g span{color:rgba(245,243,239,.55)}
  .al-poster-card .m{margin-top:8px;padding-top:8px;border-top:1px solid rgba(245,243,239,.14);font:400 9.5px/14px Sora,sans-serif;color:rgba(245,243,239,.7)}
  .al-poster-card .qr{position:absolute;right:12px;bottom:12px;width:34px;height:34px;border-radius:6px;background:repeating-linear-gradient(90deg,#F5F3EF 0 3px,transparent 3px 6px),repeating-linear-gradient(0deg,#F5F3EF 0 3px,transparent 3px 6px);background-blend-mode:multiply;opacity:.8}
  .al-poster-card--b{background:var(--v-brand-signal);color:#141414}
  .al-poster-card--b .k,.al-poster-card--b .s,.al-poster-card--b .g span,.al-poster-card--b .m{color:rgba(20,20,20,.65)}
  .al-poster-card--b .g b{color:#141414}
  .al-poster-card--b .m{border-top-color:rgba(20,20,20,.2)}
  .al-poster-card--b .qr{background:repeating-linear-gradient(90deg,#141414 0 3px,transparent 3px 6px),repeating-linear-gradient(0deg,#141414 0 3px,transparent 3px 6px)}
  .al-poster-card--c{background:#F5F3EF;color:#141414}
  .al-poster-card--c .k,.al-poster-card--c .s,.al-poster-card--c .g span,.al-poster-card--c .m{color:rgba(20,20,20,.6)}
  .al-poster-card--c .g b{color:#141414}
  .al-poster-card--c .t{color:var(--v-brand-signal)}
  .al-poster-card--c .m{border-top-color:rgba(20,20,20,.14)}
  .al-poster-card--c .qr{background:repeating-linear-gradient(90deg,#141414 0 3px,transparent 3px 6px),repeating-linear-gradient(0deg,#141414 0 3px,transparent 3px 6px)}
  .al-poster-card .badge{position:absolute;top:10px;left:10px;display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 6px;border-radius:5px;background:rgba(0,0,0,.45);color:#fff;font:500 9.5px/1 Sora,'Noto Sans SC',sans-serif}
  .al-facts{margin-top:12px;border-radius:14px;border:1px solid var(--v-border-subtle);overflow:hidden}
  .al-fact{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--v-border-subtle);font-size:13px;color:var(--v-text-primary)}
  .al-fact:first-child{border-top:0}
  .al-fact .k{flex:none;width:76px;font-size:12px;color:var(--v-text-tertiary)}
  .al-fact .v{flex:1;min-width:0}
  .al-fact .x{flex:none;font-size:11.5px;color:var(--v-text-tertiary)}
  .al-fact--missing .v{color:var(--v-text-tertiary)}
  .al-chat{display:flex;gap:24px;align-items:flex-start}
  .al-chat-col{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
  .al-chat-known{padding:12px 14px;border-radius:14px;border:1px solid var(--v-border-subtle);background:var(--v-bg-surface);font-size:12.5px;line-height:19px;color:var(--v-text-secondary)}
  .al-chat-known b{font-weight:500;color:var(--v-text-primary)}
  .al-chat-known .src{display:inline-flex;align-items:center;height:17px;padding:0 6px;border-radius:5px;background:color-mix(in srgb, var(--v-text-primary) 6%, transparent);font:500 10.5px/1 Sora,'Noto Sans SC',sans-serif;color:var(--v-text-tertiary);margin-left:4px}
  .al-chat-quick{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
  .al-chat-input{display:flex;align-items:center;gap:10px;min-height:50px;padding:0 6px 0 16px;border-radius:15px;border:1px solid var(--v-border-default);font-size:14px;color:var(--v-text-tertiary)}
  .al-chat-input .send{margin-left:auto;flex:none;height:38px;padding:0 16px;border:0;border-radius:11px;background:var(--v-brand-signal);color:var(--v-color-on-signal);font:500 13px/1 Sora,'Noto Sans SC',sans-serif}
  .al-out{width:250px;flex:none;position:sticky;top:0;border-radius:16px;border:1px solid var(--v-border-default);background:var(--v-bg-surface);padding:14px 16px}
  .al-out-h{font:500 11px/16px Sora,'Noto Sans SC',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--v-text-tertiary)}
  .al-out-item{margin-top:12px}
  .al-out-k{font-size:11.5px;color:var(--v-text-tertiary)}
  .al-out-v{margin-top:3px;font-size:13.5px;line-height:20px;color:var(--v-text-primary)}
  .al-out-v--empty{color:var(--v-text-tertiary)}
  .al-out-foot{margin-top:16px;padding-top:12px;border-top:1px solid var(--v-border-subtle);display:flex;flex-direction:column;gap:8px}
  .al-bars{display:flex;align-items:flex-end;gap:10px;height:96px;margin-top:12px;padding:0 4px}
  .al-bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
  .al-bar i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:color-mix(in srgb, var(--v-brand-signal) 55%, transparent)}
  .al-bar--on i{background:var(--v-brand-signal)}
  .al-bar span{font:400 11px/14px Sora,sans-serif;color:var(--v-text-tertiary);white-space:nowrap}
  .al-bar b{font:500 12px/14px Sora,sans-serif;color:var(--v-text-primary)}
  .al-run{margin-top:12px;border-radius:14px;border:1px solid var(--v-border-subtle);overflow:hidden}
  .al-run-row{display:flex;align-items:center;gap:14px;padding:12px 16px;border-top:1px solid var(--v-border-subtle);font-size:13.5px;color:var(--v-text-secondary)}
  .al-run-row:first-child{border-top:0}
  .al-run-row .t{flex:none;width:96px;font:500 12.5px/1 Sora,sans-serif;font-variant-numeric:tabular-nums;color:var(--v-text-tertiary)}
  .al-run-row--done{color:var(--v-text-tertiary)}
  .al-run-row--done .t{text-decoration:line-through}
  .al-run-row--now{background:color-mix(in srgb, var(--v-brand-signal) 8%, transparent);color:var(--v-text-primary)}
  .al-run-row--now .t{color:var(--v-signal-text)}
  .al-run-now{display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 8px;border-radius:6px;background:var(--v-brand-signal);color:var(--v-color-on-signal);font:500 11px/1 Sora,'Noto Sans SC',sans-serif}
  .al-run-now::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;animation:vBreathe 1.4s ease-in-out infinite}
  .al-dm{display:flex;gap:24px}
  .al-dm-list{width:250px;flex:none}
  .al-dm-row{display:flex;gap:10px;padding:12px 10px;border-radius:12px;cursor:pointer}
  .al-dm-row--on{background:color-mix(in srgb, var(--v-brand-signal) 8%, transparent)}
  .al-dm-row .n{font:500 13px/18px Sora,'Noto Sans SC',sans-serif;color:var(--v-text-primary)}
  .al-dm-row .p{margin-top:2px;font-size:12px;color:var(--v-text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .al-dm-row .d{flex:none;width:6px;height:6px;border-radius:50%;background:var(--v-brand-signal);margin-top:6px}
  .al-dm-thread{flex:1;min-width:0}
  .al-vip{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 6px;border-radius:5px;background:color-mix(in srgb, var(--v-brand-signal) 14%, transparent);font:500 10.5px/1 Sora,sans-serif;color:var(--v-signal-text)}

  /* ============ 独立的活动 AI 对话页（Muse 式三栏） ============ */
  .al-chatpage{display:grid;grid-template-columns:200px minmax(0,1fr) 250px;min-height:640px;border:1px solid var(--v-border-subtle);border-radius:18px;overflow:hidden;background:var(--v-bg-primary)}
  .al-cp-side{border-right:1px solid var(--v-border-subtle);padding:16px 12px;display:flex;flex-direction:column;gap:6px;background:var(--v-bg-surface)}
  .al-cp-brand{display:flex;align-items:center;gap:8px;padding:2px 6px 12px;font:500 12px/16px Sora,'Noto Sans SC',sans-serif;color:var(--v-text-primary)}
  .al-cp-new{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:11px;border:1px solid var(--v-border-strong);font:500 13px/1 Sora,'Noto Sans SC',sans-serif;color:var(--v-text-primary);background:none;cursor:pointer}
  .al-cp-group{margin-top:12px;padding:0 6px;font:500 10.5px/14px Sora,'Noto Sans SC',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--v-text-tertiary)}
  .al-cp-item{display:block;width:100%;box-sizing:border-box;padding:8px 10px;border:0;border-radius:10px;background:none;text-align:left;font:400 12.5px/17px Sora,'Noto Sans SC',sans-serif;color:var(--v-text-secondary);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .al-cp-item--on{background:color-mix(in srgb, var(--v-brand-signal) 10%, transparent);color:var(--v-text-primary)}
  .al-cp-item small{display:block;font-size:11px;color:var(--v-text-tertiary)}
  .al-cp-main{display:flex;flex-direction:column;min-width:0}
  .al-cp-head{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--v-border-subtle)}
  .al-cp-about{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:8px;border:1px solid var(--v-border-default);font:500 12px/1 Sora,'Noto Sans SC',sans-serif;color:var(--v-text-primary)}
  .al-cp-from{font-size:12px;color:var(--v-text-tertiary)}
  .al-cp-body{flex:1;padding:22px 20px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
  .al-cp-empty{margin:auto 0;text-align:center}
  .al-cp-empty h4{margin:14px 0 0;font:500 20px/28px Sora,'Noto Sans SC',sans-serif;letter-spacing:-.015em;color:var(--v-text-primary)}
  .al-cp-empty p{margin:6px 0 0;font-size:13px;line-height:20px;color:var(--v-text-secondary)}
  .al-cp-starts{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left}
  .al-cp-start{padding:11px 13px;border-radius:12px;border:1px solid var(--v-border-subtle);background:var(--v-bg-surface);font-size:13px;color:var(--v-text-primary);cursor:pointer}
  .al-cp-start small{display:block;margin-top:2px;font-size:11.5px;color:var(--v-text-tertiary)}
  .al-cp-foot{padding:12px 20px 16px;border-top:1px solid var(--v-border-subtle)}
  .al-cp-ctx{border-left:1px solid var(--v-border-subtle);padding:16px 16px;display:flex;flex-direction:column;gap:14px;background:var(--v-bg-surface);overflow-y:auto}
  .al-cp-ctx .al-out{width:auto;position:static;padding:0;border:0;background:none}
  .al-cp-ctx .al-chat-known{padding:10px 12px;font-size:12px;line-height:18px}
  .al-ai-answer{display:flex;gap:12px}
  .al-ai-answer .al-ask-bubble{max-width:100%}
  .al-ai-answer .al-bars{height:80px}
  .al-ai-answer .jd-people{margin-top:10px}
  .al-orb-mini{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:10px;background:color-mix(in srgb, var(--v-brand-signal) 10%, transparent);border:1px solid color-mix(in srgb, var(--v-brand-signal) 35%, transparent);color:var(--v-signal-text);flex:none}


  /* Shared reading rhythm: group headings with their own content. */
  .al-panel + .al-panel{margin-top:var(--v-space-8)}

<body>
<div class="al-app">
  <aside class="al-rail">
    <div class="al-rail-head">
      <div class="al-brand"><span style="display:inline-flex;width:17px;height:21px;color:var(--v-text-primary)"><vb-v style="width:17px;height:21px"></vb-v></span><span class="al-brand-label">Vibers · 氛围派</span><button type="button" class="al-fold" data-panel="rail" title="收起目录（[）" aria-label="收起目录"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"></path></svg></button></div>
      <div class="al-rail-title">AI 辅助原型</div>
      <div class="al-rail-sub">主办方网页端 · 先看 AI 对话和创建前；活动、通知与活动后按 P1 / P2 接入。左侧第二列选择子页面</div>
    </div>
    <div style="padding:var(--v-space-3) var(--v-space-5);border-bottom:1px solid var(--v-border-subtle)"><button type="button" class="al-btn" id="alPrioritySort" aria-pressed="false">按优先级排序</button></div>

  </aside>

  <main class="al-stage">
    <button type="button" class="al-edge al-edge--l" data-panel="rail" title="收起 / 展开目录（[）" aria-label="收起或展开目录"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"></path></svg></button>
    <button type="button" class="al-edge al-edge--r" data-panel="notes" title="收起 / 展开说明（]）" aria-label="收起或展开说明"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg></button>
    <div class="al-stage-head" id="alHead"></div>
    <div class="al-stage-body" id="alBody"></div>
    <div class="al-kbd-hint"><span class="al-kbd">←</span><span class="al-kbd">→</span> 切状态 · <span class="al-kbd">↑</span><span class="al-kbd">↓</span> 切场景 · <span class="al-kbd">[</span><span class="al-kbd">]</span> 收起两侧</div>
  </main>

  <aside class="al-notes">
    <div class="al-notes-head"><span class="al-notes-title">设计说明</span><button type="button" class="al-theme" data-pf-theme-toggle aria-label="切换深浅色模式"><span style="width:6px;height:6px;border-radius:50%;background:var(--v-brand-signal)"></span>切换到 <span data-pf-theme-label>浅色</span></button><button type="button" class="al-fold" data-panel="notes" title="收起说明（]）" aria-label="收起说明"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg></button></div>
    <div class="al-notes-body" id="alNotes"></div>
  </aside>
</div>

<script>
(function () {
  'use strict';
  // ---------- 共用小组件（场景文件只拼 HTML，不碰样式） ----------
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var SPARK = '<svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4"></path></svg>';
  var ICON = {
    mic: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>',
    back: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>',
    check: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"></path></svg>',
    cal: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>',
    pin: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>',
    clock: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>',
    bell: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 20a2 2 0 0 0 4 0"></path></svg>',
    star: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z"></path></svg>',
    starOn: '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z"></path></svg>',
    chevron: '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg>',
    img: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"></rect><path d="m3 16 5-5 4 4 3-3 6 6"></path><circle cx="16" cy="9" r="1.5"></circle></svg>',
    scan: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M4 12h16"></path></svg>',
    x: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg>',
    more: '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>'
  };

  function srcChip(kind) {
    var map = { draft: 'AI', infer: 'AI 推断', poster: '来自海报', organize: 'AI 整理', voice: '来自语音' };
    var cls = 'ce2-src-chip' + (kind === 'infer' || kind === 'poster' || kind === 'voice' ? ' ce2-src-chip--infer' : '');
    return '<span class="' + cls + '">' + SPARK + (map[kind] || kind) + '</span>';
  }
  function aiBtn(label, opts) {
    opts = opts || {};
    if (opts.busy) return '<span class="al-aibtn al-aibtn--busy' + (opts.inline ? ' al-aibtn--inline' : '') + '"><span class="al-dot"></span>' + esc(label || '写着') + '</span>';
    return '<button type="button" class="al-aibtn' + (opts.inline ? ' al-aibtn--inline' : '') + '">' + SPARK + esc(label) + '</button>';
  }
  function labelRow(label, extra) { return '<div class="ce2-field-label-row"><span class="ce2-field-label">' + esc(label) + '</span>' + (extra || '') + '</div>'; }
  function field(label, body, extra) { return '<div class="ce2-field">' + labelRow(label, extra) + body + '</div>'; }
  function input(value, placeholder, opts) {
    opts = opts || {};
    var empty = !value;
    return '<div class="ce2-input' + (empty ? ' ce2-input--empty' : '') + (opts.focus ? ' ce2-input--focus' : '') + '">' + esc(empty ? placeholder : value) + '</div>';
  }
  function textarea(value, placeholder, opts) {
    opts = opts || {};
    var empty = !value;
    return '<div class="ce2-textarea' + (empty ? ' ce2-textarea--empty' : '') + (opts.tall ? ' ce2-textarea--tall' : '') + '">' + (opts.html ? value : esc(empty ? placeholder : value)) + '</div>';
  }
  function skeleton(note) { return '<div class="al-skel"><span></span><span></span><span></span></div>' + (note ? '<div class="al-skel-note">' + esc(note) + '</div>' : ''); }
  function preview(title, bodyHtml, actions) {
    return '<div class="al-preview"><div class="al-preview-head">' + SPARK + esc(title) + '</div><div class="al-preview-body">' + bodyHtml + '</div>' +
      '<div class="al-preview-actions">' + (actions || '<button type="button" class="al-btn al-btn--primary al-btn--sm">用这个</button><button type="button" class="al-btn al-btn--ghost al-btn--sm">保留原文</button>') + '</div></div>';
  }
  function toast(msg, undo) { return '<div class="al-toast">' + ICON.check.replace('width="16" height="16"', 'width="16" height="16" style="color:var(--v-brand-signal)"') + '<span>' + esc(msg) + '</span>' + (undo ? '<span class="al-toast-undo">' + esc(undo) + '</span>' : '') + '</div>'; }
  function note(text, link) { return '<div class="al-line">' + esc(text) + (link ? '<button type="button" class="al-line-link">' + esc(link) + '</button>' : '') + '</div>'; }
  function suggest(label, small) { return '<button type="button" class="al-suggest">' + SPARK + esc(label) + (small ? '<small>' + esc(small) + '</small>' : '') + '</button>'; }
  function fchip(label, count, on) { return '<button type="button" class="al-fchip' + (on ? ' al-fchip--on' : '') + '">' + esc(label) + (count != null ? '<b>' + esc(count) + '</b>' : '') + '</button>'; }
  function switchEl(on) { return '<span class="v-switch" role="switch" aria-checked="' + (on ? 'true' : 'false') + '"></span>'; }
  function tagChip(label) { return '<span class="ce2-tag-chip">' + esc(label) + '<span class="ce2-tag-chip-x">×</span></span>'; }
  function tagOff(label) { return '<span class="ce2-tag-chip-off">' + esc(label) + '</span>'; }
  function ruleTag() { return '<span class="al-rule-tag">规则 · 不用模型</span>'; }

  // 网页端工作台外壳：头 + 横向 tab + 760 列。frameless，直接落在页面底色上。
  var TABS = ['概览', '活动信息', '报名', '嘉宾', '通知'];
  function webShell(opts) {
    opts = opts || {};
    var tabs = opts.tabs || TABS;
    var status = opts.status || 'live';
    var chip = status === 'draft' ? '<span class="ce2-status-chip ce2-status-chip--draft">草稿</span>' : status === 'ended' ? '<span class="ce2-status-chip ce2-status-chip--draft">已结束</span>' : status === 'now' ? '<span class="ce2-status-chip ce2-status-chip--live">进行中</span>' : '<span class="ce2-status-chip">报名中</span>';
    var html = '<div class="ce2-head"><span class="ce2-back">' + ICON.back + '</span><div><div class="ce2-head-title">' + esc(opts.title || '创业者夜聊 Vol.7 · 最近踩的坑') + '</div><div class="ce2-head-sub">' + esc(opts.sub || 'Vibers Shanghai · 8 月 29 日 周六 19:00–21:30') + '</div></div>' + chip +
      '<div class="ce2-head-actions">' + (opts.actions || '<button type="button" class="ce2-btn-outline">预览</button><button type="button" class="ce2-btn-outline">查看活动页</button>') + '</div></div>';
    if (tabs.length) {
      html += '<div class="ce2-htabs">' + tabs.map(function (t) {
        var name = typeof t === 'string' ? t : t.label;
        var flag = typeof t === 'string' ? '' : (t.flag ? '<span class="ce2-htab-flag">' + esc(t.flag) + '</span>' : '');
        return '<button type="button" class="ce2-htab' + (name === opts.tab ? ' ce2-htab--active' : '') + '">' + esc(name) + flag + '</button>';
      }).join('') + '</div>';
    }
    html += '<div class="ce2-main">' + opts.body + '</div>';
    return html;
  }
  function panel(h3, sub, body) { return '<section class="al-panel"><h3 class="ce2-panel-h3">' + esc(h3) + '</h3>' + (sub ? '<p class="ce2-panel-sub">' + sub + '</p>' : '') + '<div class="al-panel-content">' + body + '</div></section>'; }

  window.AILab = {
    scenes: [], register: function (s) { window.AILab.scenes.push(s); },
    h: { esc: esc, SPARK: SPARK, ICON: ICON, srcChip: srcChip, aiBtn: aiBtn, field: field, labelRow: labelRow, input: input, textarea: textarea, skeleton: skeleton, preview: preview, toast: toast, note: note, suggest: suggest, fchip: fchip, switchEl: switchEl, tagChip: tagChip, tagOff: tagOff, ruleTag: ruleTag, webShell: webShell, panel: panel }
  };

  // ---------- 查看器 ----------
  var STAGES = [{"key": "prio", "n": "00", "label": "优先级 · 按创建衔接排"}, {"key": "chat", "n": "01", "label": "AI 对话 · 先聊到能创建"}, {"key": "create", "n": "02", "label": "创建前 · 主办方到活动草稿"}, {"key": "before", "n": "03", "label": "活动前 · 优化与审核"}, {"key": "notify", "n": "04", "label": "通知与消息 · 各阶段共用"}, {"key": "live", "n": "05", "label": "活动中"}, {"key": "after", "n": "06", "label": "活动后 · 反馈与数据"}, {"key": "data", "n": "07", "label": "数据 · 已实现的页面（mock）"}];
  var cur = { id: null, state: 0 };
  var prioritySort = false;
  try { prioritySort = localStorage.getItem('al-priority-sort') === '1'; } catch (e) { /* 本次会话仍可排序 */ }
  function compareScenes(a, b) {
    var ranks = { P0: 0, P1: 1, P2: 2 };
    var rankA = ranks[a.flag] === undefined ? 3 : ranks[a.flag];
    var rankB = ranks[b.flag] === undefined ? 3 : ranks[b.flag];
    return (prioritySort ? rankA - rankB : 0) || a.id.localeCompare(b.id);
  }

  function sceneById(id) { return window.AILab.scenes.filter(function (s) { return s.id === id; })[0]; }
  function readHash() {
    var m = (location.hash || '').replace('#', '').split('-');
    var s = sceneById(m[0] === 'D03' ? 'A00' : m[0]) || window.AILab.scenes[0];
    var st = parseInt(m[1], 10); if (!(st >= 1 && st <= s.states.length)) st = 1;
    cur.id = s.id; cur.state = st - 1;
  }
  function go(id, state, push) {
    cur.id = id; cur.state = state || 0;
    if (push !== false) history.replaceState(null, '', '#' + id + '-' + (cur.state + 1));
    render();
  }
  function orderedScenes() { return STAGES.reduce(function (all, st) { return all.concat(window.AILab.scenes.filter(function (s) { return s.stage === st.key; }).sort(compareScenes)); }, []); }
  function renderDir() {
    var sortButton = document.getElementById('alPrioritySort');
    sortButton.setAttribute('aria-pressed', String(prioritySort));
    sortButton.classList.toggle('al-btn--primary', prioritySort);
    sortButton.textContent = prioritySort ? '优先级排序 · 已开启' : '按优先级排序';
    var html = '';
    STAGES.forEach(function (st) {
      html += '<div class="al-dir-stage"><span class="al-dir-stage-n">' + st.n + '</span>' + esc(st.label) + '</div>';
      orderedScenes().filter(function (s) { return s.stage === st.key; }).forEach(function (s) {
        html += '<button type="button" class="al-dir-item' + (s.id === cur.id ? ' al-dir-item--active' : '') + '" data-go="' + s.id + '"><span class="al-dir-id">' + s.id + '</span><span class="al-dir-t">' + esc(s.title) + '</span><span class="al-dir-flag' + (s.flag === 'P0' ? ' al-dir-flag--p0' : '') + '">' + esc(s.flag) + '</span></button>';
      });
    });
    document.getElementById('alDir').innerHTML = html;
    var active = document.querySelector('.al-dir-item--active');
    if (active && active.scrollIntoView) active.scrollIntoView({ block: 'nearest' });
  }
  function render() {
    var s = sceneById(cur.id);
    if (!s) return;
    renderDir();
    var surface = s.surface === 'wide' ? '网页端 · 900' : '网页端 · 760';
    document.getElementById('alHead').innerHTML = '<button type="button" class="al-btn al-expand-directory" data-panel="rail" aria-expanded="false" aria-controls="alDir alSubDir" title="展开目录（[）">展开目录</button><div><div class="al-stage-title">' + s.id + ' · ' + esc(s.title) + '</div><div class="al-stage-where">' + esc(s.where) + '</div></div><span class="al-surface">' + esc(surface) + '</span>';
    document.getElementById('alSubTitle').textContent = s.id + ' · 子页面';
    document.getElementById('alSubDir').innerHTML = s.states.map(function (st, i) {
      return '<button type="button" class="al-dir-item' + (i === cur.state ? ' al-dir-item--active' : '') + '" data-state="' + i + '"' + (i === cur.state ? ' aria-current="page"' : '') + '><span class="al-dir-id">' + String(i + 1).padStart(2, '0') + '</span><span class="al-dir-t">' + esc(st) + '</span></button>';
    }).join('');
    var selectedState = document.querySelector('#alSubDir [aria-current="page"]');
    if (selectedState) selectedState.scrollIntoView({block: 'nearest'});
    var body = document.getElementById('alBody');
    body.innerHTML = '<div class="al-frame al-frame--' + (s.surface === 'wide' ? 'wide' : 'web') + '">' + s.render(cur.state, window.AILab.h) + '</div>';
    var next = { A00: ['A01', '进入活动创建'], A02: ['A07', '查看发布前检查'] }[s.id];
    if (next) body.querySelector('.al-frame').insertAdjacentHTML('beforeend', '<div class="al-chat-quick"><button type="button" class="al-btn" data-go="' + (s.id === 'A00' ? 'A00' : 'X01') + '" data-go-state="' + (s.id === 'A00' ? '2' : '1') + '">资料不足，进入 AI 对话</button><button type="button" class="al-btn al-btn--primary" data-go="' + next[0] + '">' + next[1] + '</button></div>');
    body.scrollTop = 0;
    var notes = '<div class="al-notes-state">状态 ' + String(cur.state + 1).padStart(2, '0') + ' · <b>' + esc(s.states[cur.state]) + '</b>' + (s.stateNotes && s.stateNotes[cur.state] ? '<br>' + esc(s.stateNotes[cur.state]) : '') + '</div>';
    notes += s.notes.map(function (n) { return '<div class="al-note"><div class="al-note-k">' + esc(n[0]) + '</div><div class="al-note-v">' + n[1] + '</div></div>'; }).join('');
    document.getElementById('alNotes').innerHTML = notes;
    document.getElementById('alNotes').scrollTop = 0;
    document.title = s.id + ' · ' + s.title + ' · AI 辅助原型 · Vibers';
  }
  document.addEventListener('click', function (e) {
    if (e.target.closest('#alPrioritySort')) {
      prioritySort = !prioritySort;
      try { localStorage.setItem('al-priority-sort', prioritySort ? '1' : '0'); } catch (err) { /* 本次会话仍可排序 */ }
      renderDir();
      return;
    }
    var d = e.target.closest('[data-go]'); if (d) { go(d.getAttribute('data-go'), parseInt(d.getAttribute('data-go-state'), 10) || 0); return; }
    var st = e.target.closest('[data-state]'); if (st) { go(cur.id, parseInt(st.getAttribute('data-state'), 10)); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var s = sceneById(cur.id); if (!s) return;
    var all = orderedScenes(), idx = all.indexOf(s);
    if (e.key === 'ArrowRight') { go(cur.id, (cur.state + 1) % s.states.length); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { go(cur.id, (cur.state - 1 + s.states.length) % s.states.length); e.preventDefault(); }
    else if (e.key === 'ArrowDown') { go(all[(idx + 1) % all.length].id, 0); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { go(all[(idx - 1 + all.length) % all.length].id, 0); e.preventDefault(); }
  });
  window.addEventListener('hashchange', function () { readHash(); render(); });

  // 左右两栏折叠：记在 localStorage，下次打开保持
  var PANEL_KEY = { rail: 'al-rail-off', notes: 'al-notes-off' };
  function applyPanels() {
    var app = document.querySelector('.al-app');
    Object.keys(PANEL_KEY).forEach(function (p) {
      var off = false;
      try { off = localStorage.getItem(PANEL_KEY[p]) === '1'; } catch (e) { /* 存不上就只影响本次 */ }
      app.classList.toggle('al-app--' + p + '-off', off);
    });
  }
  function togglePanel(p) {
    var app = document.querySelector('.al-app');
    var off = !app.classList.contains('al-app--' + p + '-off');
    try { localStorage.setItem(PANEL_KEY[p], off ? '1' : '0'); } catch (e) { /* ignore */ }
    app.classList.toggle('al-app--' + p + '-off', off);
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-panel]'); if (b) togglePanel(b.getAttribute('data-panel'));
  });
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === '[') { togglePanel('rail'); e.preventDefault(); }
    else if (e.key === ']') { togglePanel('notes'); e.preventDefault(); }
  });
  window.addEventListener('DOMContentLoaded', function () { applyPanels(); readHash(); render(); });
})();
</script>
